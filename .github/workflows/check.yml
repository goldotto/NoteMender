name: Source checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/**'
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Avoid Windows RUNNER~1 aliases: update safety checks require canonical paths.
      TEMP: '${{ runner.temp }}\notemender'
      TMP: '${{ runner.temp }}\notemender'
    steps:
      - name: Prepare canonical test temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py'
